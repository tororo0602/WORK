name: Build Windows exe

on:
  push:
    branches: ["claude/**", "main", "master"]
    paths:
      - "*.py"
      - "*.spec"
      - "*.png"
      - "*.webp"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow openpyxl

      - name: Run tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem test_*.py) {
            Write-Host "== $($t.Name)"
            python $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { throw "Failed: $($failed -join ', ')" }

      - name: Build exe
        run: python -m PyInstaller --noconfirm nc_program_check_tool_v40.spec

      - name: Smoke test (launch exe and keep it alive)
        shell: pwsh
        run: |
          $exe = "dist/nc_program_check_tool_v40/nc_program_check_tool_v40.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe stayed up for 20s"
          # 起動時に自動生成された設定ファイルは配布物に含めない（既存データの上書き防止）
          Start-Sleep -Seconds 2
          Remove-Item -ErrorAction SilentlyContinue dist/nc_program_check_tool_v40/gm_glossary.json, dist/nc_program_check_tool_v40/nc_macros.json

      - uses: actions/upload-artifact@v4
        with:
          name: nc_program_check_tool_v40
          path: dist/nc_program_check_tool_v40/
          retention-days: 30
